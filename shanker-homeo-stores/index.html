<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shankar Homeo Stores</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="products.css">
</head>
<body>
    <div class="mobile-app">
        <header class="app-header">
            <h1>🏪 Shankar Homeo Stores</h1>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle">🌙</button>
        </header>

        <main class="app-content">
            <div class="search-bar animate-fade-in">
                <input type="text" class="search-input" id="searchInput" placeholder="🔍 Search for medicines, brands, or categories..." onkeyup="searchProducts()" aria-label="Search products">
                <div class="cart-icon hover-lift" onclick="window.location.href='cart.html'" role="button" tabindex="0" aria-label="View shopping cart">
                    🛒 <span id="cartCount">0</span>
                </div>
            </div>

            <div class="category-tabs animate-slide-in stagger-1">
                <button class="category-tab active hover-scale" onclick="filterProducts('all', this)">All Products</button>
                <button class="category-tab hover-scale" onclick="filterProducts('homeopathic', this)">Homeopathic</button>
                <button class="category-tab hover-scale" onclick="filterProducts('cosmetic', this)">Cosmetic</button>
            </div>

            <div class="products-grid" id="productsGrid">
                <!-- Products will be loaded here -->
            </div>
        </main>

        <nav class="bottom-nav">
            <div class="nav-item active" onclick="window.location.href='index.html'">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">Home</span>
            </div>
            <div class="nav-item" onclick="window.location.href='cart.html'">
                <span class="nav-icon">🛒</span>
                <span class="nav-label">Cart</span>
            </div>
            <div class="nav-item" onclick="window.location.href='my-orders.html'">
                <span class="nav-icon">📦</span>
                <span class="nav-label">My Orders</span>
            </div>
            <div class="nav-item" onclick="window.location.href='my-account.html'">
                <span class="nav-icon">👤</span>
                <span class="nav-label">Account</span>
            </div>
        </nav>
    </div>

    <script src="config.js"></script>
    <script src="products.js"></script>
    <script src="theme.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Edit - Shankar Homeo Stores</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .edit-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .edit-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .edit-header h1 {
            color: #333;
        }

        .header-buttons {
            display: flex;
            gap: 1rem;
        }

        .back-btn, .add-btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-btn {
            background: #6c757d;
            color: white;
        }

        .back-btn:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .add-btn {
            background: linear-gradient(135deg, #00838f 0%, #006064 100%);
            color: white;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 131, 143, 0.4);
        }

        .table-container {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #e9ecef;
        }

        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
            white-space: nowrap;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .edit-btn, .delete-btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .edit-btn {
            background: #ffc107;
            color: #333;
        }

        .edit-btn:hover {
            background: #e0a800;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 2rem;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            animation: slideDown 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .modal-header h2 {
            color: #333;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: #666;
        }

        .close-btn:hover {
            color: #333;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00838f;
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .save-btn, .cancel-btn {
            flex: 1;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .save-btn {
            background: linear-gradient(135deg, #00838f 0%, #006064 100%);
            color: white;
        }

        .save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 131, 143, 0.4);
        }

        .cancel-btn {
            background: #6c757d;
            color: white;
        }

        .cancel-btn:hover {
            background: #5a6268;
        }

        .search-box {
            margin-bottom: 1.5rem;
        }

        .search-box input {
            width: 100%;
            max-width: 400px;
            padding: 0.8rem 1rem;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
        }

        .search-box input:focus {
            outline: none;
            border-color: #00838f;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logout-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
        }

        .status-homeopathic {
            background: #e0f7fa;
            color: #006064;
        }

        .status-cosmetic {
            background: #f3e5f5;
            color: #6a1b9a;
        }

        @media (max-width: 768px) {
            .edit-container {
                padding: 1rem;
            }

            .edit-header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }

            .header-buttons {
                flex-direction: column;
                width: 100%;
            }

            .add-btn, .back-btn {
                width: 100%;
            }

            .table-container {
                padding: 1rem;
                overflow-x: auto;
            }

            table {
                font-size: 0.85rem;
            }

            th, td {
                padding: 0.5rem;
                white-space: nowrap;
            }

            .action-buttons {
                flex-direction: column;
            }

            .edit-btn, .delete-btn {
                width: 100%;
                margin-bottom: 0.3rem;
            }

            .search-box input {
                width: 100%;
            }

            .modal-content {
                width: 95%;
                margin: 10% auto;
                padding: 1.5rem;
                max-height: 85vh;
                overflow-y: auto;
            }

            .form-group input {
                padding: 0.6rem;
            }

            .form-actions {
                flex-direction: column;
            }
        }

        @media (max-width: 480px) {
            .edit-header h1 {
                font-size: 1.5rem;
            }

            table {
                font-size: 0.75rem;
            }

            th, td {
                padding: 0.3rem;
            }

            .modal-content {
                padding: 1rem;
            }

            .form-group label {
                font-size: 0.9rem;
            }

            .form-group input {
                padding: 0.5rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Shankar Homeo Stores</h1>
            <nav>
                <div class="user-info">
                    <span id="userName">User</span>
                    <button class="logout-btn" onclick="logout()">Logout</button>
                </div>
            </nav>
        </header>

        <div class="edit-container">
            <div class="edit-header">
                <h1>Stock Edit</h1>
                <div class="header-buttons">
                    <button class="add-btn" onclick="openAddModal()">+ Add New Product</button>
                    <button class="back-btn" onclick="goBack()">Back to Dashboard</button>
                </div>
            </div>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search by medicine name, brand, batch, location, or note..." onkeyup="searchStock()">
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Medicine Name</th>
                            <th>Brand Name</th>
                            <th>Batch No</th>
                            <th>Mfg Date</th>
                            <th>Exp Date</th>
                            <th>Quantity</th>
                            <th>Price (₹)</th>
                            <th>Category</th>
                            <th>Location</th>
                            <th>Note</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="stockTableBody">
                        <!-- Stock data will be populated here -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Add/Edit Modal -->
        <div id="productModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalTitle">Add New Product</h2>
                    <button class="close-btn" onclick="closeModal()">&times;</button>
                </div>
                <form id="productForm" onsubmit="saveProduct(event)">
                    <input type="hidden" id="productId">
                    <div class="form-group">
                        <label for="medicineName">Medicine Name *</label>
                        <input type="text" id="medicineName" required>
                    </div>
                    <div class="form-group">
                        <label for="brandName">Brand Name *</label>
                        <input type="text" id="brandName" required>
                    </div>
                    <div class="form-group">
                        <label for="batchNo">Batch Number *</label>
                        <input type="text" id="batchNo" required>
                    </div>
                    <div class="form-group">
                        <label for="mgfDate">Manufacturing Date *</label>
                        <input type="date" id="mgfDate" required>
                    </div>
                    <div class="form-group">
                        <label for="expDate">Expiry Date *</label>
                        <input type="date" id="expDate" required>
                    </div>
                    <div class="form-group">
                        <label for="quantity">Quantity *</label>
                        <input type="number" id="quantity" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="price">Price (₹) *</label>
                        <input type="number" id="price" min="0" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="location">Location</label>
                        <input type="text" id="location" placeholder="e.g., Shelf A-1">
                    </div>
                    <div class="form-group">
                        <label for="note">Note</label>
                        <input type="text" id="note" placeholder="Any additional notes">
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" style="width: 100%; padding: 0.8rem; border: 2px solid #e9ecef; border-radius: 8px; font-size: 1rem;">
                            <option value="homeopathic">Homeopathic</option>
                            <option value="cosmetic">Cosmetic</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="productImage">Product Images (Multiple)</label>
                        <input type="file" id="productImage" accept="image/*" multiple onchange="handleImageUpload(event)" style="width: 100%; padding: 0.8rem; border: 2px solid #e9ecef; border-radius: 8px;">
                        <input type="hidden" id="imageUrl">
                        <div id="imagePreview" style="margin-top: 0.5rem; display: flex; flex-wrap: wrap; gap: 0.5rem;"></div>
                        <p style="font-size: 0.8rem; color: #666; margin-top: 0.3rem;">Supported formats: JPG, PNG, GIF, WebP (Max 5MB each)</p>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="save-btn">Save Product</button>
                        <button type="button" class="cancel-btn" onclick="closeModal()">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <footer>
            <p>&copy; 2026 Shankar Homeo Stores. All rights reserved.</p>
        </footer>
    </div>

    <script src="stock-edit.js"></script>
</body>
</html>

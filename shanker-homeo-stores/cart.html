<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Shankar Homeo Stores</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="products.css">
</head>
<body>
    <div class="mobile-app">
        <header class="app-header">
            <h1>🛒 Shopping Cart</h1>
        </header>

        <main class="app-content">
            <div class="cart-items" id="cartItems">
                <!-- Cart items will be loaded here -->
            </div>

            <div class="cart-summary" id="cartSummary">
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span id="subtotal">₹0</span>
                </div>
                <div class="summary-row total">
                    <span>Total:</span>
                    <span id="total">₹0</span>
                </div>

                <div class="payment-section">
                    <h3>Select Payment Method</h3>
                    <div class="payment-options">
                        <label class="payment-option">
                            <input type="radio" name="paymentMethod" value="cash_delivery" checked>
                            <span>💵 Cash at Delivery</span>
                        </label>
                        <label class="payment-option">
                            <input type="radio" name="paymentMethod" value="online_now">
                            <span>📱 Pay Online Now (UPI)</span>
                        </label>
                    </div>
                    <div id="upiSection" style="display: none;">
                        <div class="upi-container">
                            <h4>Pay via UPI App</h4>
                            <p class="upi-id">UPI ID: 9844874544@ptyes</p>
                            <p class="upi-amount">Amount: ₹<span id="upiAmount">0</span></p>
                            <button class="confirm-payment-btn" onclick="redirectToUPI()">Pay Now via UPI</button>
                        </div>
                    </div>
                </div>

                <button class="checkout-btn" onclick="checkout()">🛒 Place Order</button>
            </div>
        </main>

        <nav class="bottom-nav">
            <div class="nav-item" onclick="window.location.href='index.html'">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">Home</span>
            </div>
            <div class="nav-item active" onclick="window.location.href='cart.html'">
                <span class="nav-icon">🛒</span>
                <span class="nav-label">Cart</span>
            </div>
            <div class="nav-item" onclick="window.location.href='my-orders.html'">
                <span class="nav-icon">📦</span>
                <span class="nav-label">My Orders</span>
            </div>
            <div class="nav-item" onclick="window.location.href='my-account.html'">
                <span class="nav-icon">👤</span>
                <span class="nav-label">Account</span>
            </div>
        </nav>
    </div>

    <script src="cart.js"></script>
</body>
</html>

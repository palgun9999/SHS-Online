<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Shankar Homeo Stroes</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .login-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 2rem;
        }

        .login-form {
            background: #f8f9fa;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
            margin-top: 1rem;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .verification-step {
            display: none;
        }

        .verification-step.active {
            display: block;
        }

        .user-type-selection {
            display: none;
            text-align: center;
        }

        .user-type-selection.active {
            display: block;
        }

        .user-type-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .user-type-btn {
            flex: 1;
            padding: 1.5rem;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .user-type-btn:hover {
            background: #667eea;
            color: white;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }

        .back-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 1rem;
        }

        .tabs {
            display: flex;
            margin-bottom: 2rem;
            border-bottom: 2px solid #e9ecef;
        }

        .tab {
            flex: 1;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            transition: all 0.3s ease;
        }

        .tab.active {
            color: #667eea;
            border-bottom: 2px solid #667eea;
        }

        .tab:hover {
            color: #667eea;
        }

        @media (max-width: 768px) {
            .login-container {
                padding: 1rem;
            }

            .login-form {
                padding: 1.5rem;
            }

            .user-type-buttons {
                grid-template-columns: 1fr;
            }

            .tabs {
                flex-direction: column;
            }

            .tab {
                padding: 0.8rem;
            }
        }

        @media (max-width: 480px) {
            .login-form {
                padding: 1rem;
            }

            .form-group input {
                padding: 0.6rem;
            }

            .btn {
                padding: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Shankar Homeo Stroes</h1>
            <nav>
                <button class="login-btn" onclick="window.location.href='index.html'">Home</button>
            </nav>
        </header>

        <main>
            <div class="login-container">
                <div class="tabs">
                    <div class="tab active" onclick="switchTab('login')">Login</div>
                    <div class="tab" onclick="switchTab('register')">Create Account</div>
                </div>

                <!-- Login Form -->
                <div id="loginForm" class="login-form">
                    <h2>Login to Your Account</h2>
                    <br>
                    <div class="form-group">
                        <label>Email:</label>
                        <input type="email" id="loginEmail" placeholder="Enter your email">
                    </div>
                    <div class="form-group">
                        <label>Password:</label>
                        <input type="password" id="loginPassword" placeholder="Enter your password">
                    </div>
                    <button class="btn btn-primary" onclick="handleLogin()">Login</button>
                    <div id="loginError" class="error-message" style="margin-top: 1rem;"></div>
                </div>

                <!-- Registration Form -->
                <div id="registerForm" class="login-form" style="display: none;">
                    <h2>Create Account</h2>
                    <br>
                    <div class="success-message" id="successMessage"></div>
                    <div class="error-message" id="errorMessage"></div>

                    <div class="form-group">
                        <label>Full Name:</label>
                        <input type="text" id="fullName" placeholder="Enter your full name">
                    </div>
                    <div class="form-group">
                        <label>Email:</label>
                        <input type="email" id="regEmail" placeholder="Enter your email">
                    </div>
                    <div class="form-group">
                        <label>Mobile Number:</label>
                        <input type="tel" id="mobileNumber" placeholder="Enter your mobile number">
                    </div>
                    <div class="form-group">
                        <label>Password:</label>
                        <input type="password" id="regPassword" placeholder="Create a password">
                    </div>
                    <div class="form-group">
                        <label>Account Type:</label>
                        <select id="userType" style="width: 100%; padding: 0.8rem; border: 2px solid #e9ecef; border-radius: 8px; font-size: 1rem;">
                            <option value="customer">Customer</option>
                            <option value="employee">Employee</option>
                            <option value="owner">Owner</option>
                        </select>
                    </div>
                    <button class="btn btn-primary" onclick="handleRegistration()">Create Account</button>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Shankar Homeo Stroes. All rights reserved.</p>
        </footer>
    </div>

    <script src="login.js"></script>
</body>
</html>

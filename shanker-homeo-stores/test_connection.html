<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Connection Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-btn {
            background: #00838f;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
        }
        .test-btn:hover {
            background: #006064;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #f5f5f5;
        }
        .success {
            color: green;
            font-weight: bold;
        }
        .error {
            color: red;
            font-weight: bold;
        }
        pre {
            background: #fff;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>API Connection Test</h1>
    <p>Test the connection between your web application and the backend API server.</p>

    <button class="test-btn" onclick="testConnection()">Test API Connection</button>
    <button class="test-btn" onclick="testLogin()">Test Login</button>

    <div id="result" class="result">
        <p>Click a button to test the API connection...</p>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        async function testConnection() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Testing API connection...</p>';

            try {
                const response = await fetch('http://localhost:5000');
                const data = await response.json();

                resultDiv.innerHTML = `
                    <p class="success">✓ API Server is running!</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <p class="error">✗ API Server connection failed!</p>
                    <p>Error: ${error.message}</p>
                    <p>Please make sure the backend server is running on port 5000.</p>
                `;
            }
        }

        async function testLogin() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Testing login...</p>';

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'shankarhomeostores@gmail.com',
                        password: 'SHS#123'
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.innerHTML = `
                        <p class="success">✓ Login successful!</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                        <p><strong>Token:</strong> ${data.token.substring(0, 50)}...</p>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <p class="error">✗ Login failed!</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <p class="error">✗ Login test failed!</p>
                    <p>Error: ${error.message}</p>
                    <p>Please make sure the backend server is running on port 5000.</p>
                `;
            }
        }
    </script>
</body>
</html>
